[project]
name = "vcard-backend"
version = "0.1.0"
description = "Digital business cards with GUID share links and .vcf download"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",  # form/file uploads
    "pillow>=11.0",              # photo validation + resize
    "segno>=1.6",                # QR, pure python
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",  # fastapi TestClient
    "ruff>=0.7",
    "opencv-python-headless>=5.0.0.93",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
# Email HTML has to be written as literal tables with inline styles; wrapping
# those lines would put whitespace where Outlook renders it.
"app/signature.py" = ["E501"]
"app/mailer.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
