#cloud-config
package_update: true
packages:
  - docker.io
  - docker-compose-v2
write_files:
  - path: /opt/cards/compose.yml
    permissions: "0644"
    content: |
      services:
        api:
          image: ghcr.io/shinish/vcard-api:latest
          restart: unless-stopped
          environment:
            COOKIE_SECURE: "1"
            PUBLIC_BASE_URL: "https://truetap.in"
            CORS_ORIGINS: "https://truetap.in,https://www.truetap.in"
          volumes:
            - cards-data:/data
          expose: ["8000"]
        web:
          image: ghcr.io/shinish/vcard-web:latest
          restart: unless-stopped
          environment:
            API_ORIGIN: "http://api:8000"
          depends_on: [api]
          expose: ["3000"]
        edge:
          image: caddy:2-alpine
          restart: unless-stopped
          ports: ["80:80", "443:443"]
          volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy-data:/data
            - caddy-config:/config
          depends_on: [web]
      volumes:
        cards-data:
        caddy-data:
        caddy-config:
  - path: /opt/cards/Caddyfile
    permissions: "0644"
    content: |
      # Two ways in, one app behind them. The domain gets a certificate of its own —
      # Caddy asks for it the first time someone asks for the name — and the bare
      # address keeps answering on plain HTTP, for the wait while DNS propagates and
      # for anything that still has the IP written down.
      #
      # Neither needs a cookie setting: the API marks the session cookie Secure by
      # how the request arrived, so the same image serves both.

      (app) {
      	encode zstd gzip

      	# The API is routed here rather than through the front end: Next resolves
      	# its rewrites when it builds, so a baked-in API address is wrong in every
      	# environment but the one that built the image.
      	handle /api/* {
      		reverse_proxy api:8000
      	}

      	handle {
      		reverse_proxy web:3000
      	}

      	header {
      		X-Content-Type-Options nosniff
      		Referrer-Policy strict-origin-when-cross-origin
      		-Server
      	}
      }

      truetap.in {
      	import app
      	header Strict-Transport-Security "max-age=31536000; includeSubDomains"
      }

      www.truetap.in {
      	redir https://truetap.in{uri} permanent
      }

      :80 {
      	import app
      }
runcmd:
  - systemctl enable --now docker
  - usermod -aG docker azureuser
